name: R-CMD-check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Install R package dependencies
        run: |
          Rscript -e 'install.packages(c("remotes","testthat","lintr"), repos = "https://cloud.r-project.org")'
          Rscript -e 'if (file.exists("DESCRIPTION")) remotes::install_deps(dependencies = TRUE)'

      - name: Run lintr
        run: Rscript -e 'lintr::lint_package()'

      - name: Run tests
        run: Rscript -e 'testthat::test_dir("tests/testthat", reporter = "summary")'

      - name: Run R CMD check
        run: R CMD check --no-manual --as-cran
name: R-CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      NOT_CRAN: true
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::testthat
            any::lintr
          needs: check

      - name: Syntax-check app files
        run: |
          Rscript -e 'invisible(sapply(c("helpers.R", "ui.R", "server.R"), function(f) parse(f)))'

      - name: Run tests
        run: |
          cd tests
          Rscript testthat.R

      - name: Lint
        run: |
          Rscript -e 'lints <- lintr::lint_dir(".", relative_path = TRUE); print(lints); quit(status = length(lints) > 0)'
